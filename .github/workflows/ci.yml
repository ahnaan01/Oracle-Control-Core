name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: occ-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run test:browser
        env:
          OCC_CHROMIUM_PATH: /usr/bin/google-chrome
      - run: npm run docs:generate && git diff --exit-code -- docs/manifest.schema.json docs/openapi.json
  arm64-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg OCC_UID="$(id -u)" --build-arg OCC_GID="$(id -g)" -t occ:ci .
      - name: Native ARM64 deployment and isolation smoke (no production access)
        run: python3 scripts/container-smoke.py occ:ci arm64
